name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: Check OpenAPI spec drift
        run: make spec-check ENV=prod

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDK and test dependencies
        run: python -m pip install ".[dev]" build
      - name: Run lint
        run: make lint
      - name: Run typecheck
        run: make typecheck
      - name: Run tests
        run: make test
      - name: Build distribution and test the packaged SDK
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python examples/validate_receipt.py tests/fixtures/validation/receipt-payload.json

  generated-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install generation tools
        run: |
          python -m pip install PyYAML
          npm install --global @openapitools/openapi-generator-cli@2.18.4
      - name: Verify generated models are committed
        run: |
          make generate
          git diff --exit-code -- src/cheqi/models/generated
          test -z "$(git ls-files --others --exclude-standard src/cheqi/models/generated)"
