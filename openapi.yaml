openapi: 3.0.1
info:
  title: Cheqi API
  description: Cheqi provides APIs for creating receipts and reading receipts for
    customers
  version: v1
servers:
- url: https://api.cheqi.io
  description: Production
- url: https://sandbox.api.cheqi.io
  description: Sandbox
security:
- cheqi_oauth: []
- cheqi_api_key: []
tags:
- name: Store Management
  description: Endpoints for managing lightweight store/location records under a company.
    Stores are not child companies and do not create a separate Cheqi company identity.
- name: Client Application Management
  description: "Endpoints for managing OAuth2 client applications, including registration,\
    \ secret management, and public key configuration"
- name: OAuth2 Authorization
  description: Authorize a company integration and request company-bound access tokens
- name: Credit Note Management
  description: "Endpoints for creating, managing, and retrieving credit notes (refund\
    \ receipts)"
- name: Company Management
  description: Public company endpoints for trusted partner provisioning and parent-child
    company hierarchy management
- name: Recipient Management
  description: Endpoints for resolving and matching receipt recipients
- name: Receipt Management
  description: Endpoints for creating and managing purchase receipts with end-to-end
    encryption
- name: Webhook Management
  description: Endpoints for managing webhook subscriptions to receive real-time event
    notifications
paths:
  /oauth2/authorize:
    get:
      tags:
      - OAuth2 Authorization
      summary: Initiate OAuth2 authorization
      description: Initiates the OAuth2 authorization flow. Redirects to the frontend
        authorization page where users can approve or deny access.
      operationId: authorize
      parameters:
      - name: client_id
        in: query
        description: Client application ID
        required: true
        schema:
          type: string
      - name: scope
        in: query
        description: Requested OAuth scopes (space-separated)
        required: true
        schema:
          type: string
      - name: state
        in: query
        description: State parameter for CSRF protection
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        description: Redirect URI after authorization
        required: true
        schema:
          type: string
      - name: code_challenge
        in: query
        description: PKCE S256 code challenge
        required: true
        schema:
          type: string
      - name: code_challenge_method
        in: query
        description: PKCE challenge method; only S256 is supported
        required: true
        schema:
          type: string
      - name: company_id
        in: query
        description: Requested company context
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "302":
          description: Redirect to the authorization page
          headers:
            Location:
              description: Authorization page URL
              style: simple
              schema:
                type: string
                format: uri
        "400":
          description: Invalid OAuth2 parameters
      security: []
  /oauth2/authorization-code/exchange:
    post:
      tags:
      - OAuth2 Authorization
      summary: Exchange authorization code
      description: Consume a one-time authorization code and return the approved Grant
        metadata.
      operationId: exchangeAuthorizationCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationCodeExchangeRequest"
        required: true
      responses:
        "200":
          description: Authorization code exchanged successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyAuthorizationResponse"
        "401":
          description: Invalid client credentials
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyAuthorizationResponse"
        "400":
          description: "Invalid, expired, or already used authorization code"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyAuthorizationResponse"
      security: []
  /oauth2/grants/{grantId}:
    get:
      tags:
      - OAuth2 Authorization
      summary: Get Grant details
      description: Returns the current Company and Store metadata for the Grant bound
        to the access token.
      operationId: getGrantDetails
      parameters:
      - name: grantId
        in: path
        description: Grant identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Grant not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OAuthGrantDetailsResponse"
        "200":
          description: Grant details retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OAuthGrantDetailsResponse"
        "403":
          description: The token is not authorized for this Grant or lacks company:read
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OAuthGrantDetailsResponse"
  /oauth2/token:
    post:
      tags:
      - OAuth2 Authorization
      summary: OAuth token exchange
      description: Request a short-lived Company token for an approved Grant.
      operationId: getToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCredentialsTokenRequest"
        required: true
      responses:
        "200":
          description: OAuth exchange completed successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OAuthTokenExchangeResponse"
              examples:
                Client credentials response:
                  summary: Company access token
                  description: Client credentials response
                  value:
                    access_token: opaque-access-token
                    token_type: bearer
                    expires_in: 900
                    scope: receipt:issue
        "401":
          description: Invalid client credentials
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OAuthTokenExchangeResponse"
        "400":
          description: Invalid authorization code or request parameters
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OAuthTokenExchangeResponse"
      security: []
  /company/{id}/receipt-delivery/devices/{deviceId}:
    put:
      tags:
      - Company Management
      summary: Update company receipt delivery for one device
      description: |-
        Enables or disables company receipt delivery for one of the authenticated user's devices.

        **Accessible for:** User
      operationId: updateReceiptDeliveryDevice
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyReceiptDeliveryPreferenceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyReceiptDeliveryDeviceDto"
      x-accessible-for: User
  /company/{companyId}/stores/{storeId}:
    get:
      tags:
      - Store Management
      summary: Get store location
      description: Gets a specific lightweight store/location record under the specified
        company. OAuth client applications require the store:read scope.
      operationId: getStore
      parameters:
      - name: companyId
        in: path
        description: Company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: storeId
        in: path
        description: Store ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: Not authorized to view this store
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StoreDTO"
        "404":
          description: Store or company not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StoreDTO"
        "200":
          description: Store retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StoreDTO"
    put:
      tags:
      - Store Management
      summary: Update store location
      description: Updates a lightweight store/location record under the specified
        company. OAuth client applications require the store:manage scope.
      operationId: updateStore
      parameters:
      - name: companyId
        in: path
        description: Company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: storeId
        in: path
        description: Store ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreRequest"
        required: true
      responses:
        "200":
          description: Store updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StoreDTO"
        "404":
          description: Store or company not found
          content:
            '*/*':
              schema:
                type: object
        "403":
          description: Not authorized to update this store
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: Invalid request data
          content:
            '*/*':
              schema:
                type: object
  /webhook/subscription:
    post:
      tags:
      - Webhook Management
      summary: Create webhook subscription
      description: |-
        Creates a webhook subscription to receive real-time notifications for receipt and credit note events. The webhook URL will be called when events occur for the authenticated company or client application.

        **Accessible for:** Company, Client Application
      operationId: handleWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequestBody"
        required: true
      responses:
        "200":
          description: Webhook subscription created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "400":
          description: Invalid webhook request data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "409":
          description: Duplicate webhook subscription already exists
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "403":
          description: Insufficient permissions - requires receipt:read or receipt:read:user-shared
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookResponse"
      security:
      - cheqi_oauth:
        - receipt:read
        - receipt:read:user-shared
      x-accessible-for: "Company, Client Application"
  /company/{companyId}/stores:
    get:
      tags:
      - Store Management
      summary: List store locations
      description: "Lists lightweight store/location records. When companyId is omitted,\
        \ the company is derived from the authenticated principal. This does not list\
        \ child companies. OAuth client applications require the store:read scope."
      operationId: getStores
      parameters:
      - name: companyId
        in: path
        description: Company ID; omit to use the authenticated company
        required: true
        schema:
          type: string
          format: uuid
      - name: active
        in: query
        description: Filter by active status
        required: false
        schema:
          type: boolean
      responses:
        "404":
          description: Company not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreDTO"
        "200":
          description: Stores retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreDTO"
        "403":
          description: Not authorized to view stores for this company
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreDTO"
    post:
      tags:
      - Store Management
      summary: Create store location
      description: "Creates a lightweight store/location record. When companyId is\
        \ omitted, the company is derived from the authenticated principal. Use child\
        \ companies instead when the branch or franchisee needs its own Cheqi company\
        \ identity, tax details, permissions, or reporting boundary. OAuth client\
        \ applications require the store:manage scope."
      operationId: createStore
      parameters:
      - name: companyId
        in: path
        description: Company ID; omit to use the authenticated company
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreRequest"
        required: true
      responses:
        "403":
          description: Not authorized to create stores for this company
          content:
            '*/*':
              schema:
                type: object
        "201":
          description: Store created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StoreDTO"
        "404":
          description: Company not found
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: Invalid request data
          content:
            '*/*':
              schema:
                type: object
  /recipient/resolve:
    post:
      tags:
      - Recipient Management
      summary: Resolve receipt processing devices
      description: |-
        Matches the customer from the provided identification details and returns one temporary recipient for every device owned by the matched customer. Each device receives an independently encrypted generation request. Downstream wallet and third-party recipients are resolved later for exactly one processing device.

        **Accessible for:** Company, Client Application
      operationId: matchCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentificationDetails"
        required: true
      responses:
        "200":
          description: Recipient successfully resolved and matched
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipientResolutionResponse"
        "404":
          description: No recipient found matching the provided identification details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipientResolutionResponse"
        "403":
          description: Insufficient permissions - requires receipt:issue scope
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipientResolutionResponse"
        "401":
          description: Authentication required
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipientResolutionResponse"
        "400":
          description: Invalid identification details provided
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipientResolutionResponse"
      security:
      - cheqi_oauth:
        - receipt:issue
      x-accessible-for: "Company, Client Application"
  /receipts/queue/acknowledge/received:
    post:
      tags:
      - Receipt Management
      summary: Acknowledge queued receipts
      description: |-
        Acknowledges successfully processed queued receipts for the authenticated company or client application. Requires an applicable receipt read scope.

        **Accessible for:** Client Application, Company
      operationId: acknowledgeQueuedReceipts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeRequest"
        required: true
      responses:
        "200":
          description: Queued receipts acknowledged successfully
        "403":
          description: Insufficient receipt read permission
      security:
      - cheqi_oauth:
        - receipt:read
        - receipt:read:user-shared
      x-accessible-for: "Client Application, Company"
  /receipts/queue/acknowledge/failed-permanent:
    post:
      tags:
      - Receipt Management
      summary: Acknowledge permanent failure for queued receipts
      description: |-
        Marks queued receipts as permanently failed for the authenticated company or client application. Requires an applicable receipt read scope.

        **Accessible for:** Client Application, Company
      operationId: acknowledgeQueuedReceiptsPermanentFailure
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermanentFailureAcknowledgeRequest"
        required: true
      responses:
        "403":
          description: Insufficient receipt read permission
        "200":
          description: Queued receipts marked as permanently failed successfully
      security:
      - cheqi_oauth:
        - receipt:read
        - receipt:read:user-shared
      x-accessible-for: "Client Application, Company"
  /receipt/encrypted:
    post:
      tags:
      - Receipt Management
      summary: Submit an encrypted receipt payload
      description: |-
        Queues independently encrypted definitive receipt payloads for the devices returned by POST /recipient/resolve. The backend never decrypts these requests.

        **Accessible for:** Company, Client Application
      operationId: submitEncryptedReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncryptedReceiptEnvelope"
        required: true
      responses:
        "403":
          description: Insufficient permissions
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptSubmissionResponse"
        "409":
          description: Conflicting replay for this matchId
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptSubmissionResponse"
        "400":
          description: Invalid encrypted generation request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptSubmissionResponse"
        "202":
          description: Encrypted receipt payload accepted for on-device formatting
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptSubmissionResponse"
      security:
      - cheqi_oauth:
        - receipt:issue
      x-accessible-for: "Company, Client Application"
  /receipt/email:
    post:
      tags:
      - Receipt Management
      summary: Send receipt via email
      description: |-
        Sends a purchase receipt directly to a customer via email. The receipt is delivered as a PDF attachment. Requires the receipt:issue scope.

        **Accessible for:** Company, Client Application
      operationId: submitReceiptWithEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailReceiptRequest"
        required: true
      responses:
        "400":
          description: Invalid email receipt request data
        "403":
          description: Insufficient permissions - requires receipt:issue scope
        "201":
          description: Receipt sent successfully via email
      security:
      - cheqi_oauth:
        - receipt:issue
      x-accessible-for: "Company, Client Application"
  /receipt/download:
    post:
      tags:
      - Receipt Management
      summary: Upload a client-encrypted receipt for a client-generated download link
      description: |-
        Stores the ciphertext behind a download id the SDK generated locally, so the QR code worked before this upload. First write wins: resubmitting the same downloadId with identical bytes returns 200 with the original identifiers (safe retry); different bytes or a different principal conflict with 409 and never replace the stored receipt. Requires the receipt:issue scope.

        **Accessible for:** Company, Client Application
      operationId: uploadClientEncryptedReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientReceiptDownloadRequest"
        required: true
      responses:
        "409":
          description: A different receipt is already stored under this download id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClientReceiptDownloadResponse"
        "400":
          description: "Invalid download id, IV, or ciphertext"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClientReceiptDownloadResponse"
        "200":
          description: Idempotent replay of an identical earlier upload
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClientReceiptDownloadResponse"
        "201":
          description: Encrypted receipt stored
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClientReceiptDownloadResponse"
        "403":
          description: Insufficient permissions - requires receipt:issue scope
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClientReceiptDownloadResponse"
      security:
      - cheqi_oauth:
        - receipt:issue
      x-accessible-for: "Company, Client Application"
  /oauth2/company-grants/{grantId}/suspend:
    post:
      tags:
      - OAuth2 Company Grants
      summary: Suspend a company grant immediately
      description: |2-


        **Accessible for:** User
      operationId: suspend
      parameters:
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyGrantActionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyGrantResponse"
      x-accessible-for: User
  /oauth2/company-grants/{grantId}/revoke:
    post:
      tags:
      - OAuth2 Company Grants
      summary: Revoke a company grant immediately
      description: |2-


        **Accessible for:** User
      operationId: revoke
      parameters:
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyGrantActionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyGrantResponse"
      x-accessible-for: User
  /oauth2/company-grants/{grantId}/reactivate:
    post:
      tags:
      - OAuth2 Company Grants
      summary: Reactivate a suspended company grant
      description: |2-


        **Accessible for:** User
      operationId: reactivate
      parameters:
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyGrantActionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyGrantResponse"
      x-accessible-for: User
  /credit-note/initiate:
    post:
      tags:
      - Credit Note Management
      summary: Initiate credit note request
      description: |-
        Initiates a credit note (refund) request from a customer's device. The request is encrypted and queued for processing.

        **Accessible for:** User
      operationId: createCreditNote
      parameters:
      - name: X-Device-ID
        in: header
        description: Device ID of the requesting device
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncryptedCreditNoteInitiationRequest"
        required: true
      responses:
        "403":
          description: Not authorized to initiate credit notes
        "200":
          description: Credit note initiation request accepted
        "400":
          description: Invalid request data
      x-accessible-for: User
  /credit-note/encrypted:
    post:
      tags:
      - Credit Note Management
      summary: Submit encrypted credit-note generation input
      description: |-
        Submits independently encrypted credit-note generation input for every matched owner device. Devices generate CHEQI JSON and any requested UBL CreditNote locally.

        **Accessible for:** Company, Client Application
      operationId: submitEncryptedReceipt_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncryptedCreditNoteEnvelope"
        required: true
      responses:
        "400":
          description: Invalid encrypted credit note data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptSubmissionResponse"
        "403":
          description: Insufficient permissions - requires receipt:issue scope
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptSubmissionResponse"
        "202":
          description: Encrypted credit-note generation job accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptSubmissionResponse"
      security:
      - cheqi_oauth:
        - receipt:issue
      x-accessible-for: "Company, Client Application"
  /company/{parentId}/children:
    post:
      tags:
      - Company Management
      summary: Create child company
      description: |-
        Creates a child company under an existing parent company. Use this when a branch, franchisee, or location should be modeled as its own Cheqi company with its own company identity. This is different from store management, which creates lightweight store/location records under a single company. The authenticated user must be an admin of the parent company.

        **Accessible for:** User
      operationId: addChildCompany
      parameters:
      - name: parentId
        in: path
        description: ID of the parent company
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildCompanyRequest"
        required: true
      responses:
        "403":
          description: User is not authorized to create child companies for this parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "404":
          description: Parent company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "201":
          description: Child company created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
      x-accessible-for: User
  /company/{id}/invite/employees:
    post:
      tags:
      - Company Management
      summary: Invite employees to company
      description: |-
        Sends invitation emails to one or more employees. Company-bound client applications require the company:members:invite scope and may invite only ordinary members without receipt permissions.

        **Accessible for:** User, Company, Client Application
      operationId: inviteEmployees
      parameters:
      - name: id
        in: path
        description: Company ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteEmployeeRequest"
        required: true
      responses:
        "200":
          description: Invitations sent successfully
        "400":
          description: Invalid invitation request
        "404":
          description: Company not found
        "403":
          description: Not authorized to invite employees to this company
      x-accessible-for: "User, Company, Client Application"
  /client-application/{clientApplicationId}/public-key:
    get:
      tags:
      - Client Application Management
      summary: Get client application public key
      description: |-
        Retrieves the public key information for a client application, including the key data, algorithm, and upload timestamp. This key is used to verify signatures from the client application.

        **Accessible for:** Company, User
      operationId: getClientApplicationPublicKey
      parameters:
      - name: clientApplicationId
        in: path
        description: Client application ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Client application not found or public key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKeyResponse"
        "200":
          description: Public key retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKeyResponse"
        "403":
          description: Not authorized to access this client application's public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKeyResponse"
      x-accessible-for: "Company, User"
    post:
      tags:
      - Client Application Management
      summary: Upload client application public key
      description: |-
        Uploads a public key for the client application. This key is used to verify signatures from the client application when it signs receipts or other data. Can be called by company admins or using company API key authentication.

        **Accessible for:** Company, User
      operationId: uploadClientApplicationPublicKey
      parameters:
      - name: clientApplicationId
        in: path
        description: Client application ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPublicKeyRequest"
        required: true
      responses:
        "200":
          description: Public key uploaded successfully
        "403":
          description: Not authorized to manage keys for this client application
        "400":
          description: Invalid public key format or algorithm
        "404":
          description: Client application not found
      x-accessible-for: "Company, User"
